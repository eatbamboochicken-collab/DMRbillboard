<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-backhoe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15181e" />
      <stop offset="100%" stop-color="#0a0b0d" />
    </linearGradient>
    <pattern id="grid-pat-backhoe" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#22262f" stroke-width="0.5" />
    </pattern>
  </defs>
  <rect width="600" height="400" fill="url(#bg-grad-backhoe)" />
  <rect width="600" height="400" fill="url(#grid-pat-backhoe)" />
  
  <!-- Technical Frame & Corner Anchors -->
  <rect x="20" y="20" width="560" height="360" fill="none" stroke="#2b313d" stroke-width="1" stroke-dasharray="4 4" />
  <circle cx="20" cy="20" r="3" fill="#E5A910" />
  <circle cx="580" cy="20" r="3" fill="#E5A910" />
  <circle cx="20" cy="380" r="3" fill="#E5A910" />
  <circle cx="580" cy="380" r="3" fill="#E5A910" />
  
  <!-- Technical Labels -->
  <text x="35" y="45" fill="#E5A910" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="1">DMR-EQUIP // 02</text>
  <text x="565" y="45" fill="#8f9cae" font-family="monospace" font-size="11" text-anchor="end">DUAL-ACTION EARTHMOVER</text>

  <!-- Machine Silhouette Graphic -->
  <g transform="translate(100, 75)">
    
      <!-- Ground -->
      <ellipse cx="200" cy="235" rx="170" ry="12" fill="#050608" opacity="0.6" />
      <!-- Rear Big Wheel -->
      <circle cx="120" cy="195" r="38" fill="#14171d" stroke="#495057" stroke-width="4" />
      <circle cx="120" cy="195" r="22" fill="#E5A910" stroke="#14171d" stroke-width="3" />
      <!-- Front Small Wheel -->
      <circle cx="250" cy="205" r="28" fill="#14171d" stroke="#495057" stroke-width="3" />
      <circle cx="250" cy="205" r="15" fill="#E5A910" stroke="#14171d" stroke-width="2" />
      <!-- Chassis & Cab -->
      <path d="M 120 180 L 120 115 L 180 115 L 205 150 L 260 160 L 260 195 L 140 195 Z" fill="#E5A910" stroke="#b38104" stroke-width="2" />
      <path d="M 130 125 L 175 125 L 195 155 L 130 155 Z" fill="#0d1117" stroke="#222" stroke-width="1.5" />
      <!-- Front Loader Arm & Bucket -->
      <polygon points="230,170 310,165 320,180 240,185" fill="#E5A910" stroke="#b38104" stroke-width="1.5" />
      <path d="M 310 165 L 345 160 L 340 215 L 305 215 Z" fill="#1b1e24" stroke="#E5A910" stroke-width="2" />
      <!-- Rear Backhoe Boom & Bucket -->
      <polygon points="110,170 50,110 60,100 120,160" fill="#E5A910" stroke="#b38104" stroke-width="1.5" />
      <polygon points="50,105 20,170 30,175 60,110" fill="#E5A910" stroke="#b38104" stroke-width="1.5" />
      <path d="M 20 170 C 0 185, 10 210, 35 200 Z" fill="#1b1e24" stroke="#E5A910" stroke-width="1.5" />
    
  </g>

  <!-- Bottom Badging -->
  <text x="300" y="335" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" letter-spacing="2" text-anchor="middle">BACKHOE LOADER</text>
  <text x="300" y="358" fill="#E5A910" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5" text-anchor="middle">DMR PRACTICAL OPERATOR TRAINING</text>
</svg>