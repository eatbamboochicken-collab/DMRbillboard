<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-bulldozer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15181e" />
      <stop offset="100%" stop-color="#0a0b0d" />
    </linearGradient>
    <pattern id="grid-pat-bulldozer" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#22262f" stroke-width="0.5" />
    </pattern>
  </defs>
  <rect width="600" height="400" fill="url(#bg-grad-bulldozer)" />
  <rect width="600" height="400" fill="url(#grid-pat-bulldozer)" />
  
  <!-- Technical Frame & Corner Anchors -->
  <rect x="20" y="20" width="560" height="360" fill="none" stroke="#2b313d" stroke-width="1" stroke-dasharray="4 4" />
  <circle cx="20" cy="20" r="3" fill="#E5A910" />
  <circle cx="580" cy="20" r="3" fill="#E5A910" />
  <circle cx="20" cy="380" r="3" fill="#E5A910" />
  <circle cx="580" cy="380" r="3" fill="#E5A910" />
  
  <!-- Technical Labels -->
  <text x="35" y="45" fill="#E5A910" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="1">DMR-EQUIP // 07</text>
  <text x="565" y="45" fill="#8f9cae" font-family="monospace" font-size="11" text-anchor="end">HEAVY TRACK CRAWLER</text>

  <!-- Machine Silhouette Graphic -->
  <g transform="translate(100, 75)">
    
      <!-- Ground -->
      <ellipse cx="200" cy="235" rx="170" ry="12" fill="#050608" opacity="0.6" />
      <!-- Heavy High-Drive Tracks -->
      <polygon points="70,215 90,165 240,165 265,215" fill="#1b1e24" stroke="#495057" stroke-width="3" />
      <circle cx="165" cy="155" r="16" fill="#2d3239" stroke="#E5A910" stroke-width="2" />
      <circle cx="85" cy="205" r="14" fill="#2d3239" />
      <circle cx="135" cy="205" r="12" fill="#2d3239" />
      <circle cx="185" cy="205" r="12" fill="#2d3239" />
      <circle cx="245" cy="205" r="14" fill="#2d3239" />
      <!-- Massive Cab & Engine -->
      <path d="M 90 165 L 110 95 L 175 95 L 185 130 L 250 130 L 250 175 Z" fill="#E5A910" stroke="#b38104" stroke-width="2" />
      <path d="M 120 105 L 165 105 L 175 135 L 120 135 Z" fill="#0d1117" stroke="#222" stroke-width="1.5" />
      <!-- Massive Blade & Hydraulic Push Arms -->
      <line x1="140" y1="190" x2="300" y2="185" stroke="#1b1e24" stroke-width="8" stroke-linecap="round" />
      <path d="M 290 130 C 310 160, 310 200, 285 225 L 305 225 C 330 195, 330 155, 310 130 Z" fill="#1b1e24" stroke="#E5A910" stroke-width="2" />
      <!-- Rear Ripper Shank -->
      <path d="M 80 180 L 40 190 L 30 220" stroke="#1b1e24" stroke-width="6" stroke-linecap="round" />
    
  </g>

  <!-- Bottom Badging -->
  <text x="300" y="335" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" letter-spacing="2" text-anchor="middle">BULLDOZER</text>
  <text x="300" y="358" fill="#E5A910" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5" text-anchor="middle">DMR PRACTICAL OPERATOR TRAINING</text>
</svg>