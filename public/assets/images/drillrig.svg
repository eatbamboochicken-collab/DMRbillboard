<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-drillrig" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15181e" />
      <stop offset="100%" stop-color="#0a0b0d" />
    </linearGradient>
    <pattern id="grid-pat-drillrig" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#22262f" stroke-width="0.5" />
    </pattern>
  </defs>
  <rect width="600" height="400" fill="url(#bg-grad-drillrig)" />
  <rect width="600" height="400" fill="url(#grid-pat-drillrig)" />
  
  <!-- Technical Frame & Corner Anchors -->
  <rect x="20" y="20" width="560" height="360" fill="none" stroke="#2b313d" stroke-width="1" stroke-dasharray="4 4" />
  <circle cx="20" cy="20" r="3" fill="#E5A910" />
  <circle cx="580" cy="20" r="3" fill="#E5A910" />
  <circle cx="20" cy="380" r="3" fill="#E5A910" />
  <circle cx="580" cy="380" r="3" fill="#E5A910" />
  
  <!-- Technical Labels -->
  <text x="35" y="45" fill="#E5A910" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="1">DMR-EQUIP // 10</text>
  <text x="565" y="45" fill="#8f9cae" font-family="monospace" font-size="11" text-anchor="end">MINING & GEOTECHNICAL</text>

  <!-- Machine Silhouette Graphic -->
  <g transform="translate(100, 75)">
    
      <!-- Ground -->
      <ellipse cx="200" cy="235" rx="170" ry="12" fill="#050608" opacity="0.6" />
      <!-- Heavy Crawler Tracks -->
      <rect x="70" y="195" width="220" height="34" rx="17" fill="#1b1e24" stroke="#495057" stroke-width="3" />
      <circle cx="95" cy="212" r="11" fill="#2d3239" stroke="#E5A910" stroke-width="2" />
      <circle cx="150" cy="212" r="9" fill="#2d3239" />
      <circle cx="200" cy="212" r="9" fill="#2d3239" />
      <circle cx="265" cy="212" r="11" fill="#2d3239" stroke="#E5A910" stroke-width="2" />
      <!-- Base Chassis & Compressor -->
      <path d="M 80 195 L 80 140 L 220 140 L 220 195 Z" fill="#E5A910" stroke="#b38104" stroke-width="2" />
      <rect x="90" y="145" width="60" height="35" fill="#1b1e24" />
      <!-- Giant Angled Drill Mast & Kelly Bar -->
      <polygon points="230,190 280,30 305,35 255,195" fill="#1b1e24" stroke="#E5A910" stroke-width="2" />
      <!-- Drill Head & Steel Rod -->
      <rect x="260" y="70" width="30" height="35" rx="3" fill="#E5A910" stroke="#b38104" stroke-width="1.5" />
      <line x1="280" y1="50" x2="310" y2="230" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    
  </g>

  <!-- Bottom Badging -->
  <text x="300" y="335" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" letter-spacing="2" text-anchor="middle">DRILL RIG</text>
  <text x="300" y="358" fill="#E5A910" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5" text-anchor="middle">DMR PRACTICAL OPERATOR TRAINING</text>
</svg>