<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-loader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15181e" />
      <stop offset="100%" stop-color="#0a0b0d" />
    </linearGradient>
    <pattern id="grid-pat-loader" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#22262f" stroke-width="0.5" />
    </pattern>
  </defs>
  <rect width="600" height="400" fill="url(#bg-grad-loader)" />
  <rect width="600" height="400" fill="url(#grid-pat-loader)" />
  
  <!-- Technical Frame & Corner Anchors -->
  <rect x="20" y="20" width="560" height="360" fill="none" stroke="#2b313d" stroke-width="1" stroke-dasharray="4 4" />
  <circle cx="20" cy="20" r="3" fill="#E5A910" />
  <circle cx="580" cy="20" r="3" fill="#E5A910" />
  <circle cx="20" cy="380" r="3" fill="#E5A910" />
  <circle cx="580" cy="380" r="3" fill="#E5A910" />
  
  <!-- Technical Labels -->
  <text x="35" y="45" fill="#E5A910" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="1">DMR-EQUIP // 03</text>
  <text x="565" y="45" fill="#8f9cae" font-family="monospace" font-size="11" text-anchor="end">HEAVY WHEEL LOADER</text>

  <!-- Machine Silhouette Graphic -->
  <g transform="translate(100, 75)">
    
      <!-- Ground -->
      <ellipse cx="200" cy="235" rx="170" ry="12" fill="#050608" opacity="0.6" />
      <!-- Rear Massive Wheel -->
      <circle cx="110" cy="190" r="42" fill="#14171d" stroke="#495057" stroke-width="5" />
      <circle cx="110" cy="190" r="24" fill="#E5A910" stroke="#14171d" stroke-width="3" />
      <!-- Front Massive Wheel -->
      <circle cx="250" cy="190" r="42" fill="#14171d" stroke="#495057" stroke-width="5" />
      <circle cx="250" cy="190" r="24" fill="#E5A910" stroke="#14171d" stroke-width="3" />
      <!-- Body & Articulated Chassis -->
      <path d="M 70 190 L 70 145 L 140 140 L 165 105 L 215 105 L 225 150 L 260 150 L 260 190 Z" fill="#E5A910" stroke="#b38104" stroke-width="2" />
      <path d="M 170 115 L 210 115 L 218 145 L 170 145 Z" fill="#0d1117" stroke="#222" stroke-width="1.5" />
      <!-- Heavy Loader Arms -->
      <polygon points="180,165 310,140 315,160 190,185" fill="#E5A910" stroke="#b38104" stroke-width="2" />
      <!-- Giant Loader Bucket -->
      <path d="M 300 135 L 365 130 L 360 215 L 295 210 Z" fill="#1b1e24" stroke="#E5A910" stroke-width="2.5" />
    
  </g>

  <!-- Bottom Badging -->
  <text x="300" y="335" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" letter-spacing="2" text-anchor="middle">FRONT-END LOADER</text>
  <text x="300" y="358" fill="#E5A910" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5" text-anchor="middle">DMR PRACTICAL OPERATOR TRAINING</text>
</svg>