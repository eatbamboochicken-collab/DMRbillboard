<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-forklift" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15181e" />
      <stop offset="100%" stop-color="#0a0b0d" />
    </linearGradient>
    <pattern id="grid-pat-forklift" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#22262f" stroke-width="0.5" />
    </pattern>
  </defs>
  <rect width="600" height="400" fill="url(#bg-grad-forklift)" />
  <rect width="600" height="400" fill="url(#grid-pat-forklift)" />
  
  <!-- Technical Frame & Corner Anchors -->
  <rect x="20" y="20" width="560" height="360" fill="none" stroke="#2b313d" stroke-width="1" stroke-dasharray="4 4" />
  <circle cx="20" cy="20" r="3" fill="#E5A910" />
  <circle cx="580" cy="20" r="3" fill="#E5A910" />
  <circle cx="20" cy="380" r="3" fill="#E5A910" />
  <circle cx="580" cy="380" r="3" fill="#E5A910" />
  
  <!-- Technical Labels -->
  <text x="35" y="45" fill="#E5A910" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="1">DMR-EQUIP // 04</text>
  <text x="565" y="45" fill="#8f9cae" font-family="monospace" font-size="11" text-anchor="end">INDUSTRIAL MATERIAL HANDLER</text>

  <!-- Machine Silhouette Graphic -->
  <g transform="translate(100, 75)">
    
      <!-- Ground -->
      <ellipse cx="200" cy="235" rx="160" ry="12" fill="#050608" opacity="0.6" />
      <!-- Wheels -->
      <circle cx="120" cy="205" r="25" fill="#14171d" stroke="#495057" stroke-width="3" />
      <circle cx="120" cy="205" r="14" fill="#E5A910" />
      <circle cx="240" cy="205" r="25" fill="#14171d" stroke="#495057" stroke-width="3" />
      <circle cx="240" cy="205" r="14" fill="#E5A910" />
      <!-- Chassis & Counterweight -->
      <path d="M 80 205 L 80 150 L 120 150 L 150 120 L 220 120 L 240 180 L 250 205 Z" fill="#E5A910" stroke="#b38104" stroke-width="2" />
      <!-- Roll Cage / Mast Frame -->
      <line x1="150" y1="120" x2="150" y2="175" stroke="#1b1e24" stroke-width="4" />
      <line x1="210" y1="120" x2="210" y2="175" stroke="#1b1e24" stroke-width="4" />
      <rect x="140" y="115" width="85" height="8" rx="2" fill="#1b1e24" />
      <!-- Vertical Mast -->
      <rect x="260" y="60" width="16" height="150" fill="#1b1e24" stroke="#495057" stroke-width="2" />
      <rect x="270" y="70" width="10" height="135" fill="#E5A910" />
      <!-- Fork Carriage & Forks -->
      <rect x="250" y="150" width="30" height="25" fill="#333" stroke="#E5A910" stroke-width="1.5" />
      <path d="M 280 170 L 360 170 L 360 176 L 275 176 Z" fill="#f8f9fa" stroke="#333" stroke-width="1.5" />
      <!-- Pallet Cargo -->
      <rect x="290" y="125" width="55" height="40" fill="#2b303a" stroke="#E5A910" stroke-width="1.5" stroke-dasharray="3 3" />
    
  </g>

  <!-- Bottom Badging -->
  <text x="300" y="335" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" letter-spacing="2" text-anchor="middle">FORKLIFT</text>
  <text x="300" y="358" fill="#E5A910" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5" text-anchor="middle">DMR PRACTICAL OPERATOR TRAINING</text>
</svg>