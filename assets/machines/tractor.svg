<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-tractor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15181e" />
      <stop offset="100%" stop-color="#0a0b0d" />
    </linearGradient>
    <pattern id="grid-pat-tractor" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#22262f" stroke-width="0.5" />
    </pattern>
  </defs>
  <rect width="600" height="400" fill="url(#bg-grad-tractor)" />
  <rect width="600" height="400" fill="url(#grid-pat-tractor)" />
  
  <!-- Technical Frame & Corner Anchors -->
  <rect x="20" y="20" width="560" height="360" fill="none" stroke="#2b313d" stroke-width="1" stroke-dasharray="4 4" />
  <circle cx="20" cy="20" r="3" fill="#E5A910" />
  <circle cx="580" cy="20" r="3" fill="#E5A910" />
  <circle cx="20" cy="380" r="3" fill="#E5A910" />
  <circle cx="580" cy="380" r="3" fill="#E5A910" />
  
  <!-- Technical Labels -->
  <text x="35" y="45" fill="#E5A910" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="1">DMR-EQUIP // 05</text>
  <text x="565" y="45" fill="#8f9cae" font-family="monospace" font-size="11" text-anchor="end">AGRICULTURAL & UTILITY</text>

  <!-- Machine Silhouette Graphic -->
  <g transform="translate(100, 75)">
    
      <!-- Ground -->
      <ellipse cx="200" cy="235" rx="170" ry="12" fill="#050608" opacity="0.6" />
      <!-- Massive Rear Cleated Wheel -->
      <circle cx="115" cy="180" r="48" fill="#14171d" stroke="#495057" stroke-width="5" />
      <circle cx="115" cy="180" r="26" fill="#E5A910" stroke="#14171d" stroke-width="3" />
      <!-- Front Small Wheel -->
      <circle cx="260" cy="205" r="26" fill="#14171d" stroke="#495057" stroke-width="3" />
      <circle cx="260" cy="205" r="14" fill="#E5A910" stroke="#14171d" stroke-width="2" />
      <!-- Hood & Cab -->
      <path d="M 120 180 L 120 100 L 175 100 L 195 140 L 285 140 L 290 195 L 140 195 Z" fill="#E5A910" stroke="#b38104" stroke-width="2" />
      <path d="M 130 110 L 170 110 L 185 140 L 130 140 Z" fill="#0d1117" stroke="#222" stroke-width="1.5" />
      <!-- Exhaust Stack -->
      <rect x="230" y="80" width="8" height="60" fill="#1b1e24" rx="2" />
      <path d="M 230 80 L 242 70" stroke="#1b1e24" stroke-width="4" stroke-linecap="round" />
    
  </g>

  <!-- Bottom Badging -->
  <text x="300" y="335" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" letter-spacing="2" text-anchor="middle">TRACTOR</text>
  <text x="300" y="358" fill="#E5A910" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5" text-anchor="middle">DMR PRACTICAL OPERATOR TRAINING</text>
</svg>