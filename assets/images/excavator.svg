<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="heroSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1f26"/>
      <stop offset="60%" stop-color="#111317"/>
      <stop offset="100%" stop-color="#0b0c0e"/>
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFC820"/>
      <stop offset="50%" stop-color="#F2B400"/>
      <stop offset="100%" stop-color="#C98F00"/>
    </linearGradient>
    <linearGradient id="metalDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d444f"/>
      <stop offset="50%" stop-color="#252a33"/>
      <stop offset="100%" stop-color="#14171c"/>
    </linearGradient>
    <linearGradient id="treadGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111317"/>
      <stop offset="25%" stop-color="#2b313a"/>
      <stop offset="50%" stop-color="#181c22"/>
      <stop offset="75%" stop-color="#2b313a"/>
      <stop offset="100%" stop-color="#0f1115"/>
    </linearGradient>
    <pattern id="gridPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(242,180,0,0.08)" stroke-width="1"/>
    </pattern>
    <filter id="shadowHeavy" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background Environment (Industrial Stage) -->
  <rect width="800" height="480" fill="url(#heroSky)"/>
  <rect width="800" height="480" fill="url(#gridPattern)"/>

  <!-- Technical Metric Watermarks -->
  <text x="30" y="50" fill="rgba(242,180,0,0.3)" font-family="monospace" font-size="12" letter-spacing="3">DMR-CAT336-HEAVY-DUTY // CAT-30T-CLASS</text>
  <text x="770" y="50" text-anchor="end" fill="rgba(255,255,255,0.25)" font-family="monospace" font-size="11">HARARE QUARRY SIMULATION SPEC</text>
  <line x1="30" y1="60" x2="770" y2="60" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Ground Plane & Dust Shadow -->
  <ellipse cx="430" cy="420" rx="340" ry="32" fill="#000000" opacity="0.85"/>
  <path d="M 50 425 L 750 425" stroke="#F2B400" stroke-width="2" opacity="0.4" stroke-dasharray="12, 8"/>

  <!-- EXCAVATOR BODY GROUP -->
  <g filter="url(#shadowHeavy)" transform="translate(40, 20)">

    <!-- Undercarriage & Continuous Tracks -->
    <g id="tracks">
      <rect x="220" y="340" width="360" height="58" rx="29" fill="url(#metalDark)" stroke="#111317" stroke-width="3"/>
      <!-- Track Belt -->
      <rect x="215" y="336" width="370" height="66" rx="33" fill="none" stroke="url(#treadGrad)" stroke-width="10"/>
      <!-- Sprockets & Rollers -->
      <circle cx="250" cy="369" r="24" fill="#181c22" stroke="#F2B400" stroke-width="3"/>
      <circle cx="250" cy="369" r="10" fill="#2c333e"/>
      <circle cx="550" cy="369" r="24" fill="#181c22" stroke="#F2B400" stroke-width="3"/>
      <circle cx="550" cy="369" r="10" fill="#2c333e"/>
      <!-- Bottom Track Rollers -->
      <circle cx="310" cy="376" r="14" fill="#111317" stroke="#3d444f" stroke-width="2"/>
      <circle cx="370" cy="376" r="14" fill="#111317" stroke="#3d444f" stroke-width="2"/>
      <circle cx="430" cy="376" r="14" fill="#111317" stroke="#3d444f" stroke-width="2"/>
      <circle cx="490" cy="376" r="14" fill="#111317" stroke="#3d444f" stroke-width="2"/>
      <!-- Track Grousers/Teeth -->
      <path d="M 220 336 L 580 336 M 220 402 L 580 402" stroke="#0b0c0e" stroke-width="4" stroke-dasharray="6, 6"/>
    </g>

    <!-- Turntable / Slew Ring -->
    <rect x="330" y="325" width="140" height="18" fill="#181c22" stroke="#F2B400" stroke-width="1"/>

    <!-- Counterweight & Engine Housing (DMR Yellow / Charcoal) -->
    <path d="M 440 330 L 590 330 L 575 230 L 410 230 Z" fill="url(#yellowGrad)" stroke="#111317" stroke-width="2"/>
    <!-- Black Counterweight Rear Block -->
    <path d="M 520 330 L 590 330 L 575 230 L 510 230 Z" fill="#181c22"/>
    <rect x="525" y="245" width="45" height="60" rx="3" fill="#0d0f12"/>
    <line x1="530" y1="255" x2="565" y2="255" stroke="#F2B400" stroke-width="3"/>
    <line x1="530" y1="265" x2="565" y2="265" stroke="#F2B400" stroke-width="3"/>
    <line x1="530" y1="275" x2="565" y2="275" stroke="#F2B400" stroke-width="3"/>
    <line x1="530" y1="285" x2="565" y2="285" stroke="#F2B400" stroke-width="3"/>

    <!-- Exhaust Stack & Air Intake -->
    <rect x="545" y="195" width="12" height="35" rx="2" fill="#181c22"/>
    <rect x="543" y="190" width="16" height="6" rx="2" fill="#3d444f"/>

    <!-- Operator Cabin (Reinforced ROPS/FOPS) -->
    <g id="cabin">
      <!-- Outer Shell -->
      <path d="M 330 330 L 425 330 L 420 180 L 350 180 L 320 250 Z" fill="#181c22" stroke="#2c333e" stroke-width="2"/>
      <!-- Tinted Glass Canopy -->
      <path d="M 332 250 L 355 190 L 410 190 L 410 280 L 340 280 Z" fill="#465c6e" opacity="0.6"/>
      <!-- Glass Glare Reflection -->
      <path d="M 345 200 L 360 200 L 345 260 L 335 260 Z" fill="#ffffff" opacity="0.3"/>
      <!-- Safety Handrails (DMR Yellow) -->
      <path d="M 315 320 L 315 260 L 330 260" fill="none" stroke="#F2B400" stroke-width="3"/>
      <circle cx="395" cy="182" r="5" fill="#F2B400"/>
    </g>

    <!-- DMR Logo Mark on Machine -->
    <rect x="425" y="255" width="75" height="30" rx="2" fill="#111317"/>
    <text x="462" y="276" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="16" fill="#F2B400" letter-spacing="1">DMR</text>

    <!-- EXCAVATOR BOOM (Heavy Yellow Articulated Arm) -->
    <g id="boom">
      <!-- Main Boom -->
      <path d="M 350 280 L 260 140 L 140 180 L 175 225 L 275 190 L 345 320 Z" fill="url(#yellowGrad)" stroke="#111317" stroke-width="2"/>
      <circle cx="350" cy="285" r="12" fill="#181c22" stroke="#F2B400" stroke-width="2"/>
      <!-- Hydraulic Boom Cylinder -->
      <path d="M 385 305 L 290 190" stroke="#333b47" stroke-width="12" stroke-linecap="round"/>
      <path d="M 330 240 L 290 190" stroke="#c5d0de" stroke-width="6" stroke-linecap="round"/>

      <!-- Stick / Arm (Dipper) -->
      <path d="M 140 180 L 40 290 L 60 315 L 170 215 Z" fill="url(#yellowGrad)" stroke="#111317" stroke-width="2"/>
      <circle cx="155" cy="198" r="10" fill="#181c22" stroke="#F2B400" stroke-width="2"/>
      <!-- Arm Cylinder -->
      <path d="M 230 155 L 115 225" stroke="#333b47" stroke-width="9" stroke-linecap="round"/>
      <path d="M 170 190 L 115 225" stroke="#c5d0de" stroke-width="5" stroke-linecap="round"/>

      <!-- Heavy Bucket with Hardox Teeth -->
      <g id="bucket" transform="translate(20, 280)">
        <path d="M 20 10 L 60 20 L 50 65 L -10 85 L -35 55 L -10 20 Z" fill="#20242c" stroke="#111317" stroke-width="2"/>
        <!-- Bucket Teeth (Yellow tipped) -->
        <polygon points="-10,85 0,105 8,83" fill="#F2B400"/>
        <polygon points="10,80 20,100 28,78" fill="#F2B400"/>
        <polygon points="30,75 40,95 48,73" fill="#F2B400"/>
        <!-- Bucket Pivot Pins -->
        <circle cx="20" cy="15" r="7" fill="#111317" stroke="#F2B400" stroke-width="2"/>
        <circle cx="38" cy="22" r="6" fill="#111317" stroke="#F2B400" stroke-width="2"/>
      </g>
    </g>

    <!-- Work Lights Glow -->
    <polygon points="340,180 180,240 190,320 330,220" fill="#F2B400" opacity="0.15"/>
    <circle cx="340" cy="185" r="4" fill="#ffffff"/>
  </g>

  <!-- Technical Spec Callout overlay -->
  <g transform="translate(560, 390)">
    <rect width="200" height="50" rx="3" fill="rgba(9,10,13,0.85)" stroke="#F2B400" stroke-width="1"/>
    <text x="12" y="22" fill="#F2B400" font-family="sans-serif" font-weight="900" font-size="12" letter-spacing="1">CAT 336 CLASS</text>
    <text x="12" y="38" fill="#ffffff" font-family="monospace" font-size="10">2 WEEKS INTENSIVE TRAINING</text>
  </g>
</svg>
