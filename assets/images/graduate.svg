<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="gradBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#181c24"/>
      <stop offset="100%" stop-color="#090a0d"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#gradBg)"/>
  <rect x="20" y="20" width="560" height="360" fill="none" stroke="#F2B400" stroke-width="1" opacity="0.3"/>
  
  <!-- Operator Silhouette with Hardhat & Hi-Vis -->
  <circle cx="300" cy="140" r="50" fill="#2c333e"/>
  <!-- Hard Hat -->
  <path d="M 240 135 C 240 85, 360 85, 360 135 Z" fill="#F2B400"/>
  <rect x="230" y="130" width="140" height="10" rx="3" fill="#C98F00"/>
  <circle cx="300" cy="110" r="6" fill="#ffffff"/>

  <!-- High-Vis Vest Body -->
  <path d="M 210 260 L 230 190 L 370 190 L 390 260 L 390 380 L 210 380 Z" fill="#F2B400"/>
  <!-- Silver Retroreflective Stripes -->
  <rect x="245" y="190" width="22" height="190" fill="#e8edf5"/>
  <rect x="333" y="190" width="22" height="190" fill="#e8edf5"/>
  <rect x="210" y="290" width="180" height="24" fill="#e8edf5"/>

  <!-- DMR Credential Badge -->
  <rect x="260" y="220" width="80" height="45" rx="3" fill="#111317" stroke="#ffffff" stroke-width="1"/>
  <text x="300" y="238" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="11" fill="#F2B400">DMR CERTIFIED</text>
  <text x="300" y="253" text-anchor="middle" font-family="monospace" font-size="8" fill="#ffffff">LICENSED OPERATOR</text>

  <!-- Overlay Typography -->
  <rect x="30" y="300" width="540" height="70" rx="4" fill="rgba(9,10,13,0.85)" stroke="#2c333e"/>
  <text x="50" y="328" font-family="sans-serif" font-weight="900" font-size="16" fill="#F2B400" letter-spacing="1">TENDAI M. — EXCAVATOR OPERATOR</text>
  <text x="50" y="352" font-family="sans-serif" font-size="12" fill="#d2d7e0">Graduated Class of 2024 • Currently operating on Harare-Chitungwiza Highway project</text>
</svg>
