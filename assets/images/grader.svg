<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-grader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15181e" />
      <stop offset="100%" stop-color="#0a0b0d" />
    </linearGradient>
    <pattern id="grid-pat-grader" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#22262f" stroke-width="0.5" />
    </pattern>
  </defs>
  <rect width="600" height="400" fill="url(#bg-grad-grader)" />
  <rect width="600" height="400" fill="url(#grid-pat-grader)" />
  
  <!-- Technical Frame & Corner Anchors -->
  <rect x="20" y="20" width="560" height="360" fill="none" stroke="#2b313d" stroke-width="1" stroke-dasharray="4 4" />
  <circle cx="20" cy="20" r="3" fill="#E5A910" />
  <circle cx="580" cy="20" r="3" fill="#E5A910" />
  <circle cx="20" cy="380" r="3" fill="#E5A910" />
  <circle cx="580" cy="380" r="3" fill="#E5A910" />
  
  <!-- Technical Labels -->
  <text x="35" y="45" fill="#E5A910" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="1">DMR-EQUIP // 09</text>
  <text x="565" y="45" fill="#8f9cae" font-family="monospace" font-size="11" text-anchor="end">PRECISION LEVELING & ROADING</text>

  <!-- Machine Silhouette Graphic -->
  <g transform="translate(100, 75)">
    
      <!-- Ground -->
      <ellipse cx="200" cy="235" rx="170" ry="12" fill="#050608" opacity="0.6" />
      <!-- Rear Tandem Wheels -->
      <circle cx="75" cy="198" r="28" fill="#14171d" stroke="#495057" stroke-width="3" />
      <circle cx="125" cy="198" r="28" fill="#14171d" stroke="#495057" stroke-width="3" />
      <!-- Front Steering Wheels -->
      <circle cx="310" cy="198" r="28" fill="#14171d" stroke="#495057" stroke-width="3" />
      <circle cx="310" cy="198" r="15" fill="#E5A910" stroke="#14171d" stroke-width="2" />
      <!-- Rear Engine & Center High Cab -->
      <path d="M 50 190 L 50 145 L 140 145 L 155 100 L 195 100 L 205 155 L 150 170 L 140 190 Z" fill="#E5A910" stroke="#b38104" stroke-width="2" />
      <path d="M 160 110 L 190 110 L 195 145 L 160 145 Z" fill="#0d1117" stroke="#222" stroke-width="1.5" />
      <!-- Long Gooseneck Frame -->
      <path d="M 180 155 L 305 165 L 305 190" fill="none" stroke="#E5A910" stroke-width="8" />
      <!-- Moldboard Blade underneath -->
      <polygon points="210,185 270,185 260,215 200,215" fill="#1b1e24" stroke="#E5A910" stroke-width="2" />
    
  </g>

  <!-- Bottom Badging -->
  <text x="300" y="335" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" letter-spacing="2" text-anchor="middle">MOTOR GRADER</text>
  <text x="300" y="358" fill="#E5A910" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5" text-anchor="middle">DMR PRACTICAL OPERATOR TRAINING</text>
</svg>