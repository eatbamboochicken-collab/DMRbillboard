<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-dumptruck" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15181e" />
      <stop offset="100%" stop-color="#0a0b0d" />
    </linearGradient>
    <pattern id="grid-pat-dumptruck" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#22262f" stroke-width="0.5" />
    </pattern>
  </defs>
  <rect width="600" height="400" fill="url(#bg-grad-dumptruck)" />
  <rect width="600" height="400" fill="url(#grid-pat-dumptruck)" />
  
  <!-- Technical Frame & Corner Anchors -->
  <rect x="20" y="20" width="560" height="360" fill="none" stroke="#2b313d" stroke-width="1" stroke-dasharray="4 4" />
  <circle cx="20" cy="20" r="3" fill="#E5A910" />
  <circle cx="580" cy="20" r="3" fill="#E5A910" />
  <circle cx="20" cy="380" r="3" fill="#E5A910" />
  <circle cx="580" cy="380" r="3" fill="#E5A910" />
  
  <!-- Technical Labels -->
  <text x="35" y="45" fill="#E5A910" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="1">DMR-EQUIP // 08</text>
  <text x="565" y="45" fill="#8f9cae" font-family="monospace" font-size="11" text-anchor="end">ARTICULATED & RIGID HAULER</text>

  <!-- Machine Silhouette Graphic -->
  <g transform="translate(100, 75)">
    
      <!-- Ground -->
      <ellipse cx="200" cy="235" rx="170" ry="12" fill="#050608" opacity="0.6" />
      <!-- Giant Hauler Wheels -->
      <circle cx="100" cy="190" r="40" fill="#14171d" stroke="#495057" stroke-width="4" />
      <circle cx="100" cy="190" r="22" fill="#E5A910" stroke="#14171d" stroke-width="3" />
      <circle cx="260" cy="190" r="40" fill="#14171d" stroke="#495057" stroke-width="4" />
      <circle cx="260" cy="190" r="22" fill="#E5A910" stroke="#14171d" stroke-width="3" />
      <!-- Cab & Hood -->
      <path d="M 205 190 L 205 130 L 245 105 L 300 105 L 315 155 L 315 190 Z" fill="#E5A910" stroke="#b38104" stroke-width="2" />
      <path d="M 250 115 L 290 115 L 298 145 L 250 145 Z" fill="#0d1117" stroke="#222" stroke-width="1.5" />
      <!-- Giant Dump Body / Tipper -->
      <polygon points="50,120 195,120 190,175 60,175" fill="#E5A910" stroke="#b38104" stroke-width="2" />
      <polygon points="35,100 65,100 50,120 20,120" fill="#1b1e24" stroke="#E5A910" stroke-width="1.5" />
      <!-- Tipper Ribs -->
      <line x1="85" y1="125" x2="85" y2="170" stroke="#1b1e24" stroke-width="3" />
      <line x1="120" y1="125" x2="120" y2="170" stroke="#1b1e24" stroke-width="3" />
      <line x1="155" y1="125" x2="155" y2="170" stroke="#1b1e24" stroke-width="3" />
    
  </g>

  <!-- Bottom Badging -->
  <text x="300" y="335" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" letter-spacing="2" text-anchor="middle">DUMP TRUCK</text>
  <text x="300" y="358" fill="#E5A910" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5" text-anchor="middle">DMR PRACTICAL OPERATOR TRAINING</text>
</svg>